[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unherd"
version = "0.1.0"
description = "Fleet Cron Collision Analyzer, Thundering-Herd De-synchronizer & Retry-Storm Simulator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "unherd contributors" }
]
keywords = ["cron", "crontab", "thundering-herd", "jitter", "sre", "kubernetes", "distributed-systems"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Monitoring",
]

[project.scripts]
unherd = "unherd.cli:main"

[tool.setuptools]
packages = ["unherd"]
